services:
  db:
    image: postgres:16-alpine
    container_name: tcgstore-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tcgstore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/esquema.sql:/docker-entrypoint-initdb.d/01-esquema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tcgstore"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: tcgstore-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@db:5432/tcgstore
      DB_SSL: "false"
      JWT_SECRET: tcgstore_docker_production_jwt_secret_32chars
      JWT_EXPIRES_IN: 2h
      CORS_ORIGIN: http://localhost,http://localhost:80,http://localhost:5173,http://127.0.0.1
      CLIENT_URL: http://localhost

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000/api
    container_name: tcgstore-frontend
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "80:80"

volumes:
  postgres_data:

networks:
  default:
    name: tcgstore-network
